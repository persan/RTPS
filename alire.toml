name = "rtps"
description = "RTPS 2.2 DDS Interoperability Wire Protocol (OMG DDSI-RTPS) in Ada"
long-description = """
An interface to, and partial implementation of, the Real-time Publish-Subscribe
Protocol (RTPS) 2.2 - the DDS Interoperability Wire Protocol defined by the
Object Management Group in DDSI-RTPS 2.2 (OMG document formal/2014-09-01).

Implemented: the Messages Module (clause 8.3 / 9.4.5 wire mapping) - RTPS
Header, all 13 submessages with wire encode/decode in both endiannesses,
SequenceNumberSet/FragmentNumberSet bitmaps, ParameterList - the PIM/PSM
types (GUID, SequenceNumber, Time, Locator, ParameterIds, default port
formulas), a HistoryCache (8.2.2), a Message Receiver (8.3.4), the UDPv4
transport (clause 9 PSM, GNAT.Sockets), the reliable StatefulWriter /
StatefulReader protocol machines (8.4.9.2 / 8.4.12.2), the SPDP/SEDP
discovery protocols (8.5), the Writer Liveliness Protocol (8.4.13), the
clause-10 data encapsulation (CDR / PL_CDR) and GAP coalescing.

All constants and wire layouts are taken from the normative text of the
specification and cross-referenced to clause numbers in the source comments.
"""
version = "0.2.0"
licenses = "GPL-3.0-or-later"
website = "https://github.com/persan/RTPS"

authors = ["Per Sandberg"]
maintainers = ["Per Sandberg <per.s.sandberg@bahnhof.se>"]
maintainers-logins = ["persan"]
tags = ["rtps", "dds", "networking", "protocol", "wire-protocol"]

project-files = ["rtps.gpr"]

[build-switches]
development.compile_checks = "errors"
validation.runtime_checks = "everything"
release.optimization = "performance"

# Test-only dependency (AUnit framework, used by test/).
# The compiler itself is not pinned as a crate dependency: Alire picks
# the configured toolchain (alr toolchain), which may be an external
# GNAT Pro install that the "gnat" meta-crate cannot represent.
[[depends-on]]
aunit = "^26.0"

# First release: wire-encoding core only, no dependencies beyond the
# compiler. API is subject to change.
