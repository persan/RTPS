name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build & test (Alire, stable toolchain)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Alire and toolchain
        uses: alire-project/setup-alire@v4
        with:
          version: 2.1.0
          toolchain: gnat_native^15 gprbuild^25

      - name: Build library
        run: alr build

      - name: Build tests
        run: alr exec -- gprbuild -P test/test_rtps.gpr

      - name: Run tests
        run: test/test_rtps | tee test_output.txt

      - name: Publish test summary
        if: always()
        run: |
          {
            echo "## RTPS test results (${{ github.sha }})"
            echo '```'
            grep -E "^(PASS|FAIL|==)" test_output.txt || true
            echo '```'
          } >> $GITHUB_STEP_SUMMARY