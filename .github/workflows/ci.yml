name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build & test (Alire, stable toolchain)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Alire and toolchain
        uses: alire-project/setup-alire@v4
        with:
          version: 2.1.0
          toolchain: gnat_native^15 gprbuild^25

      - name: Diagnose gprbuild toolchain detection
        run: |
          alr exec -- which gnat gprbuild
          echo "--- config projects found:"
          find / -name "gnat_stub.cgpr" -o -name "*.cgpr" 2>/dev/null | head -5
          echo "--- GPR_PROJECT_PATH: $GPR_PROJECT_PATH"
          echo "--- gnat config knowledge base:"
          ls /home/runner/.local/share/alire/toolchains/gnat_native*/lib/gpr 2>/dev/null | head -5 || true
          gprconfig --version 2>/dev/null || true

      - name: Build library
        run: alr build

      - name: Build and run tests
        run: |
          TOOLCHAIN_BIN=$(dirname "$(alr exec -- which gprbuild)")
          echo "Toolchain bin: $TOOLCHAIN_BIN"
          ls "$TOOLCHAIN_BIN" | head -20
          export GPR_PROJECT_PATH="$(dirname "$TOOLCHAIN_BIN")/lib/gpr:$GPR_PROJECT_PATH"
          gprbuild -P test/test_rtps.gpr
          test/test_rtps | tee test_output.txt
          grep -q "FAIL" test_output.txt && exit 1 || exit 0

      - name: Publish test summary
        if: always()
        run: |
          {
            echo "## RTPS test results (${{ github.sha }})"
            echo '```'
            grep -E "^(PASS|FAIL|==)" test_output.txt || true
            echo '```'
          } >> $GITHUB_STEP_SUMMARY