name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build & test (Alire, stable toolchain)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Alire and toolchain
        uses: alire-project/setup-alire@v4
        with:
          version: 2.1.0
          toolchain: gnat_native^15 gprbuild^25

      - name: Build library and tests
        run: |
          GNAT_BIN=$(dirname "$(find /home/runner/.local/share/alire/toolchains -name gnat -type f | head -1)")
          GPRBUILD_BIN=$(dirname "$(find /home/runner/.local/share/alire/toolchains -name gprbuild -type f | head -1)")
          export PATH="$GNAT_BIN:$GPRBUILD_BIN:$PATH"
          gnat --version
          gprbuild --version
          gprbuild -P rtps.gpr
          gprbuild -P test/test_rtps.gpr
          test/test_rtps | tee test_output.txt
          grep -q "FAIL" test_output.txt && exit 1 || exit 0

      - name: Publish test summary
        if: always()
        run: |
          {
            echo "## RTPS test results (${{ github.sha }})"
            echo '```'
            grep -E "^(PASS|FAIL|==)" test_output.txt || true
            echo '```'
          } >> $GITHUB_STEP_SUMMARY