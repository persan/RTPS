name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build & test (Alire, stable toolchain)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Alire and toolchain
        uses: alire-project/setup-alire@v4
        with:
          version: 2.1.0
          toolchain: gnat_native^15 gprbuild^25

      - name: Build library
        run: alr build --skip-submodules

      - name: Build and run tests
        run: |
          alr exec -- gprbuild -Ptest/test_rtps.gpr
          test/test_rtps

      - name: Test summary
        if: always()
        run: |
          echo "RTPS test run on ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          test/test_rtps > test_output.txt 2>&1 || true
          grep -E "^(PASS|FAIL|==)" test_output.txt >> $GITHUB_STEP_SUMMARY || true